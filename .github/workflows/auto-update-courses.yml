name: Auto Update Courses

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      replay_latest:
        description: Re-evaluate the newest entries from every feed
        required: false
        default: false
        type: boolean
      shadow_mode:
        description: Run AI review without changing course files
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: auto-update-courses
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COURSE_AI_BASE_URL: https://cfjwlpro.com/
      COURSE_AI_MODEL: gpt-5.6-sol
      COURSE_AI_API_KEY: ${{ secrets.COURSE_AI_API_KEY }}
      COURSE_SYNC_MODE: ${{ inputs.shadow_mode && 'shadow' || 'auto' }}
      COURSE_SYNC_REPLAY_LATEST: ${{ inputs.replay_latest && '1' || '0' }}
      COURSE_SYNC_MAX_PER_SOURCE: '3'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Review feed updates
        run: npm run courses:sync

      - name: Validate generated site
        run: npm run build

      - name: Commit approved updates
        run: |
          if git diff --quiet; then
            echo "No approved course updates"
            exit 0
          fi

          git config user.name "cs-courses-update-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add automation/course-feed-state.json course-content
          git commit -m "chore(courses): apply AI-reviewed feed updates"
          git push origin HEAD:${GITHUB_REF_NAME}
